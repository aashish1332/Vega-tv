    bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
  }
  return btoa(bin);
}

// ---- kvStore (persistent, namespaced per provider; mirrors providerKvStorage) ----
/* The real bundles call providerContext.kvStore 192 times: it is where they keep
   a cf_clearance cookie, a scraped token, a memoised catalog, and per-episode
   resume points. This used to be a plain JS object on this page, so every
   invoke started from an empty store and a Cloudflare clearance earned on one
   call was gone by the next — which is why a solved challenge kept reappearing
   and token-gated providers could never work at all. Now it is backed by
   DataStore natively, keyed "<provider>:<key>".

   Strings are stored verbatim; anything else is JSON-encoded. That mirrors how
   providers actually use it (they overwhelmingly store a token and read it back
   as text) and avoids re-parsing "123" into a number on the way out. */
window.__kvStore={
  get:function(k){ return __rpc('kvGet',{key:String(k)}); },
  set:function(k,v){
    var s=(typeof v==='string')?v:JSON.stringify(v===undefined?null:v);
    return __rpc('kvSet',{key:String(k),value:s});
  },
  delete:function(k){ return __rpc('kvDelete',{key:String(k)}); },
  keys:function(){ return __rpc('kvKeys',{}); },
  values:function(){ var s=this; return s.keys().then(function(ks){
    return Promise.all(ks.map(function(k){ return s.get(k); })); }); },
  entries:function(){ var s=this; return s.keys().then(function(ks){
    return Promise.all(ks.map(function(k){ return s.get(k).then(function(v){ return [k,v]; }); })); }); },
  clear:function(){ return __rpc('kvClear',{}); }
};

// ---- Crypto (digest/random via native MessageDigest, like providerRpc.crypto) ----
window.__cryptoShim={
  digestStringAsync:function(algo,msg){
    return __rpc('crypto',{algorithm:String(algo||''), data:__utf8ToB64(msg)}).then(__b64ToHex);
  },
  /* Upstream decodes its base64 random bytes back into a Uint8Array; returning
     a plain Array instead broke providers that call .buffer or index it as
     bytes, so keep the typed array. */
  getRandomBytesAsync:function(n){
    var a=new Uint8Array(Math.min(n||0,1024));
    crypto.getRandomValues(a);
    return Promise.resolve(a);
  },
  randomUUID:function(){ return (crypto.randomUUID? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){ var r=Math.random()*16|0; return (c==='x'?r:(r&0x3|0x8)).toString(16); })); }
};

// ---- getBaseUrl (native, 1h cache, mirrors getBaseUrl.ts) ----
window.__getBaseUrl=function(pv){
  return __rpc('getBaseUrl',{providerValue:String(pv)}).then(function(u){ return (u==null?'':String(u)); });
};

/* TypeScript's helper for transpiled async functions. Bundles that were not
   fully bundled inline (or built without tslib) call __awaiter as a bare
   identifier; the mobile sandbox passes it as a module parameter, so the TV
   runtime must expose the same shape or those modules die with a
   ReferenceError at load. */
window.__awaiter=function(thisArg,args,PromiseConstructor,generator){
  var C=PromiseConstructor||Promise;
  var adopt=function(v){ return (v instanceof C)? v : new C(function(r){ r(v); }); };
  return new C(function(resolve,reject){
    var iterator;
    var step=function(result){
      if(result.done){ resolve(result.value); return; }
      adopt(result.value).then(fulfilled,rejected);
    };
    var fulfilled=function(value){ try{ step(iterator.next(value)); }catch(e){ reject(e); } };
    var rejected=function(value){ try{ step(iterator.throw(value)); }catch(e){ reject(e); } };
    iterator=generator.apply(thisArg,args||[]);
    step(iterator.next());
  });
};

// ---- sandbox state ----
window.__vegaReset=function(){
  window.__vegaExports={};
  window.__vegaModule={exports:window.__vegaExports};
  window.providerGlobal={};
  window.__code='';
  // Bare-name aliases: bundles run with "use strict" and reference `exports`
  // / `module` directly; globals resolve via window in any eval scope.
  window.exports=window.__vegaExports;
  window.module=window.__vegaModule;
};
window.__vegaReset();
// Provider bundles call console.log heavily (they log the URL they build and
// every post they parse). Forward it natively so a TV user can read what the
// provider actually did; there is no logcat on a TV box. The sink is defined
// BEFORE any override so a missing bridge degrades to a no-op, never a throw.
window.__vegaNativeTrace=function(line){
  try{ if(window.VegaHttp&&window.VegaHttp.trace) window.VegaHttp.trace(String(line)); }catch(e){}
};
window.__vegaConsole=function(level,args){
  try{
    var parts=[]; for(var i=0;i<args.length;i++){
      var a=args[i];
      if(a&&typeof a==='object'){ try{ a=JSON.stringify(a); }catch(e){ a='[object]'; } }
      parts.push(String(a));
    }
    window.__vegaNativeTrace(level+': '+parts.join(' ').slice(0,500));
  }catch(e){}
};
['log','warn','error','info','debug'].forEach(function(lv){
  try{ console[lv]=function(){ window.__vegaConsole(lv,arguments); }; }catch(e){}
});

// ---- invoke ----
/* Android's evaluateJavascript does NOT await a returned Promise: it serialises
   the return value straight away, so a Promise arrives as `{}` — which decoded
   to a null payload and surfaced as "non-array: null" no matter what the provider
   returned. Push the result into the native bridge instead and return at once.

   Every payload carries the invoke id: cancelling the Kotlin invoke cannot stop
   the JS promise it already started, so an orphan can resolve after the next
   invoke is already waiting. The id lets the bridge drop that stale payload
   instead of completing the wrong request (the old search-lag bug). */
window.__vegaDone=function(id, payload){
  try{ if(window.VegaHttp&&window.VegaHttp.result) window.VegaHttp.result(String(id), String(payload)); }
  catch(e){}
};
/* Abort the JS side of an invoke. Passing null/'' aborts whatever is active.
   In-flight provider fetches observe the AbortController signal, so a
   superseded search stops costing network instead of running to completion. */
window.__vegaAbort=function(id){
  var active=window.__vegaActiveInvoke;
  if(active && (!id || active.id===String(id))){
    window.__vegaActiveInvoke=null;
    try{ if(active.controller) active.controller.abort(); }catch(e){}
  }
};
window.__vegaInvoke=function(exportName, args){
  args=args||{};
  var invokeId=String(args.invokeId||'');
  // A new invoke means the previous one is no longer wanted. Abort it before
  // touching the shared module/exports so its fetch chain winds down.
  window.__vegaAbort(null);
  __pv=String(args.providerValue||'');
  var modExports=(window.__vegaModule&&window.__vegaModule.exports)||{};
  var fn=modExports[exportName];
  if(typeof fn!=='function'){
    window.__vegaDone(invokeId, JSON.stringify({__error:'missing export '+exportName}));
    return 'started';
  }
  /* openWebView is how a provider asks the *user* to clear a Cloudflare
     interstitial or click through a gate, and it expects the solved page back.
     It is used 51 times across the real bundles and used to reject outright, so
     every one of those call sites failed and roughly half the published
     providers could never return a stream. It now routes to the visible WAF
     screen and comes back with {data, cookies, cookieMap, userAgent, url}. */
  var ctx={
    axios:window.__axiosShim, cheerio:window.__cheerio, Crypto:window.__cryptoShim,
    getBaseUrl:window.__getBaseUrl, commonHeaders:(args.commonHeaders)||{},
    getCookies:function(url){ return __rpc('getCookies',{url:String(url||'')}); },
    openWebView:function(url, options){
      options=options||{};
      // A human is solving the gate: the provider budget must not keep
      // counting down while the dialog is on screen.
      if(window.__vegaWafPause) window.__vegaWafPause();
      var p=__rpc('openWebView',{
        url:String(url||''),
        waitForCookie: options.waitForCookie||'',
        waitForLoad: !!options.waitForLoad,
        force: !!options.force,
        headers: options.headers||{},
        injectedJavaScript: options.injectedJavaScript||'',
        timeoutMs: options.timeoutMs||0,
        title: options.title||'',
        description: options.description||''
      },0);
      return p.then(
        function(v){ if(window.__vegaWafResume) window.__vegaWafResume(); return v; },
        function(e){ if(window.__vegaWafResume) window.__vegaWafResume(); throw e; }
      );
    },
    kvStore:window.__kvStore
  };
  var controller=new AbortController();
  window.__vegaActiveInvoke={id:invokeId, controller:controller};
  var budget=(args.timeoutMs)||120000;
  var remaining=budget;
  var timer=null;
  var finished=false;
  /* One completion path: the first result wins, and a superseded invoke can
     never post a second payload or clobber the next invoke's WAF hooks. */
  var done=function(payload){
    if(finished) return;
    finished=true;
    if(timer!==null){ clearTimeout(timer); timer=null; }
    if(window.__vegaActiveInvoke && window.__vegaActiveInvoke.id===invokeId){
      window.__vegaActiveInvoke=null;
    }
    window.__vegaDone(invokeId, payload);
  };
  var clearWaf=function(){
    if(!window.__vegaActiveInvoke || window.__vegaActiveInvoke.id===invokeId){
      window.__vegaWafPause=null;
      window.__vegaWafResume=null;
    }
  };
  var started=Date.now();
  var wafDepth=0;
  var onTimeout=function(){
    timer=null;
    try{ controller.abort(); }catch(e){}
    done(JSON.stringify({__error:'Provider '+exportName+' timed out after '+
      budget+'ms (the provider fetch never returned)'}));
  };
  // Aborting this invoke (a newer call started) also stops its timeout timer.
  try{
    controller.signal.addEventListener('abort',function(){
      if(timer!==null){ clearTimeout(timer); timer=null; }
    });
  }catch(e){}
  var arm=function(ms){
    started=Date.now();
    timer=setTimeout(onTimeout,Math.max(1000,ms));
  };
  var pauseBudget=function(){
    wafDepth++;
    if(wafDepth===1 && timer!==null){
      clearTimeout(timer);
      timer=null;
      remaining-=Date.now()-started;
      if(remaining<1000) remaining=1000;
    }
  };
  var resumeBudget=function(){
    if(wafDepth>0) wafDepth--;
    if(wafDepth===0 && timer===null && !controller.signal.aborted){
      arm(remaining);
    }
  };
  window.__vegaWafPause=pauseBudget;
  window.__vegaWafResume=resumeBudget;
  arm(budget);
  var callArgs=Object.assign({},(args.params)||{},{signal:controller.signal,providerContext:ctx});
  window.__vegaConsole('info','invoke '+exportName+' params='+JSON.stringify((args.params)||{}));
  Promise.resolve().then(function(){ return fn(callArgs); }).then(
    function(r){
      clearWaf();
      var t=(r===undefined)?'undefined':(r===null?'null':Array.isArray(r)?'array('+r.length+')':typeof r);
      window.__vegaConsole('info','invoke '+exportName+' -> '+t);
      /* providerGlobal survives across invokes on mobile (fresh worker per call,
         state handed in and returned). Push it natively before the result so
         the host has it when the invoke settles — the bridge calls are ordered,
         and a provider mutation must not be lost just because the app moved on. */
      try{ if(window.VegaHttp&&window.VegaHttp.state) window.VegaHttp.state(invokeId, JSON.stringify(window.providerGlobal||{})); }catch(e){}
      done(JSON.stringify({__ok:(r===undefined?null:r)}));
    },
    function(e){
      clearWaf();
      window.__vegaConsole('error','invoke '+exportName+' threw: '+String((e&&e.message||e)));
      done(JSON.stringify({__error:String((e&&e.message||e))}));
    }
  );
  return 'started';
};
